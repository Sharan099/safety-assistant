name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: passive_safety, POSTGRES_PASSWORD: change_me, POSTGRES_DB: passive_safety }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U passive_safety" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.11.14", enable-cache: true }
      - run: uv sync --frozen --extra s3
      - name: lint
        run: uv run ruff check src tests scripts migrations && uv run ruff format --check src tests scripts
      - name: types
        run: uv run mypy src scripts/eval scripts/maintenance
      - name: unit + parser golden + evaluation schema (no services)
        run: uv run pytest tests/unit tests/parser_golden tests/evaluation -q -p no:cacheprovider
      - name: security / adversarial
        run: uv run pytest tests/security -q -p no:cacheprovider
      - name: integration + e2e (PostgreSQL, synthetic corpus, hashing embeddings)
        run: uv run pytest tests/integration tests/e2e -q -p no:cacheprovider
      - name: retrieval regression gate (skips when no real corpus is present)
        run: uv run pytest tests/retrieval_regression -q -p no:cacheprovider -rs

  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: passive_safety, POSTGRES_PASSWORD: change_me, POSTGRES_DB: passive_safety }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U passive_safety" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://passive_safety:change_me@localhost:5433/safety_assistant
      EMBEDDING_PROVIDER: fastembed
      LLM_PROVIDER: none
      AUTH_MODE: none
      DEV_LOGIN_ENABLED: "true"
      SESSION_SECRET: ci-session-secret-not-for-production-0123456789
      ARTIFACT_STORE_URI: file://./data/artifacts-ci
      API_INTERNAL_URL: http://localhost:8010
      E2E_REGULATION: UN R999
      E2E_QUESTION: What is the thorax compression criterion limit in R999?
      E2E_TERM: thorax
      E2E_QUESTION_2: What is the head performance criterion in R999?
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.11.14", enable-cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: uv sync --frozen --extra s3
      - name: database + synthetic corpus
        run: |
          psql postgresql://passive_safety:change_me@localhost:5433/passive_safety -c "CREATE DATABASE safety_assistant" || true
          uv run safety-assistant migrate
          uv run python scripts/maintenance/seed_synthetic_corpus.py
      - name: api + worker
        run: |
          nohup uv run uvicorn safety_assistant.api.main:app --port 8010 > api.log 2>&1 &
          nohup uv run safety-assistant worker --poll-seconds 1 > worker.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:8010/health/ready && break || sleep 2; done
      - name: frontend checks + build
        working-directory: frontend
        run: npm ci && npm run typecheck && npm run lint && npm run build
      - name: playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: frontend/test-results }

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform -chdir=infra/terraform fmt -check -diff
      - run: terraform -chdir=infra/terraform init -backend=false -input=false && terraform -chdir=infra/terraform validate

  container:
    needs: quality
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with: { context: ., file: infra/docker/Dockerfile, load: true, tags: "safety-assistant:ci", cache-from: type=gha, cache-to: type=gha,mode=max }
      - name: smoke (liveness inside the image, no services needed)
        run: |
          docker run --rm -d --name sa -e APP_ENV=development -e AUTH_MODE=api_key -e API_KEYS='{"k":"RegulationViewer"}' -p 8010:8010 safety-assistant:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8010/health/live && break || sleep 2; done
          docker rm -f sa
      - name: vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "safety-assistant:ci", format: sarif, output: trivy.sarif, severity: "CRITICAL,HIGH", ignore-unfixed: true }
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy.sarif }
      - name: SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@v0
        with: { image: "safety-assistant:ci", format: cyclonedx-json, artifact-name: sbom.cdx.json }
