name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }
permissions: { contents: read }

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: passive_safety, POSTGRES_PASSWORD: change_me, POSTGRES_DB: passive_safety }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U passive_safety" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.11.14", enable-cache: true }
      - run: uv sync --frozen --extra s3
      - name: lint
        run: uv run ruff check src tests scripts migrations && uv run ruff format --check src tests scripts
      - name: types
        run: uv run mypy src scripts/eval scripts/maintenance
      - name: unit + parser golden + evaluation schema (no services)
        run: uv run pytest tests/unit tests/parser_golden tests/evaluation -q -p no:cacheprovider
      - name: security / adversarial
        run: uv run pytest tests/security -q -p no:cacheprovider
      - name: integration + e2e (PostgreSQL, synthetic corpus, hashing embeddings)
        run: uv run pytest tests/integration tests/e2e -q -p no:cacheprovider
      - name: retrieval regression gate (skips when no real corpus is present)
        run: uv run pytest tests/retrieval_regression -q -p no:cacheprovider -rs

  container:
    needs: quality
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with: { context: ., file: infra/docker/Dockerfile, load: true, tags: "safety-assistant:ci", cache-from: type=gha, cache-to: type=gha,mode=max }
      - name: smoke (liveness inside the image, no services needed)
        run: |
          docker run --rm -d --name sa -e APP_ENV=development -e AUTH_MODE=api_key -e API_KEYS='{"k":"RegulationViewer"}' -p 8010:8010 safety-assistant:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8010/health/live && break || sleep 2; done
          docker rm -f sa
      - name: vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: "safety-assistant:ci", format: sarif, output: trivy.sarif, severity: "CRITICAL,HIGH", ignore-unfixed: true }
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy.sarif }
      - name: SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@v0
        with: { image: "safety-assistant:ci", format: cyclonedx-json, artifact-name: sbom.cdx.json }
