name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings python-dotenv httpx pytest
      - name: Smoke imports + unit tests
        run: |
          python -c "from api.main import app; print(app.title)"
          pytest -q tests/test_validation_observability.py
      # LEGACY — not the CI gate. Smoke-imports eval.quality_gate only.
      # Authoritative scheduled gate: .github/workflows/quality-gate.yml → eval.run_full.
      - name: Legacy quality_gate import smoke (fixture)
        run: |
          mkdir -p eval/results
          python - <<'PY'
          import json
          from pathlib import Path
          Path("eval/results/latest.json").write_text(json.dumps({
            "scorecard": {"recall@5": 0.8, "deepeval_faithfulness": 0.85},
            "retrieval": {"averages": {"recall@5": 0.8}},
            "deepeval": {"averages": {"faithfulness": 0.85}},
          }), encoding="utf-8")
          PY
          python -m eval.quality_gate --scorecard eval/results/latest.json --require-faithfulness
