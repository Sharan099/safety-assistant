# Development database only. The full stack (API + Postgres + MinIO) lives in
# infra/docker/compose.yaml. Host port is configurable: POSTGRES_PORT=5433 by default.
name: safety-assistant-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: passive-safety-cae-agent-postgres # kept: existing local volume/DBs live under this name
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-passive_safety}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-passive_safety}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-passive_safety} -d ${POSTGRES_DB:-passive_safety}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
