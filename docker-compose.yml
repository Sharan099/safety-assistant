services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: passive_safety
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: passive_safety
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passive_safety -d passive_safety"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
