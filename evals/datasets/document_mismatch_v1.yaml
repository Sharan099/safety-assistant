# Document-level retrieval mismatch (DRM) benchmark.
#
# Every case targets a clause that has a lexically/semantically near-identical twin in another
# document of the corpus (frontal UN R94 vs side UN R95; seat-belt UN R16 vs child-restraint
# UN R129; main body vs annex). The query names the document *context* (crash mode, restraint
# type, vehicle category) but not the regulation number, so the retriever has to resolve the
# source from document-level meaning. `hard_negative_regulation_keys` records the twin that a
# chunk-only retriever tends to pick.
#
# Provenance: source=synthetic — written from inspection of the ingested corpus (section paths and
# the quoted requirements were read from the `sections` table on 2026-09-13), not by an LLM and not
# by the product owner. human_reviewed stays false until the owner checks them.
dataset_version: document_mismatch_v1
cases:
  # ---------------------------------------------------------------- UN R94 (frontal) vs UN R95 (side)
  - case_id: drm-001
    query: In the frontal impact test, are the doors allowed to open during the test?
    query_type: exception_condition
    difficulty: hard
    expected_regulation_key: UN-R94
    hard_negative_regulation_keys: [UN-R95]
    expected_section_paths: ["5.2.3"]
    key_facts: ["no door shall open"]
    source: synthetic
    review_status: DRAFT
