  # ---------------------------------------------------------------- market / regime context
  - case_id: sc-030
    query: We sell the same car in the EU and the US. Which frontal-impact documents in the corpus apply to each market, and what kind of compliance regime is each?
    query_type: market_context
    difficulty: hard
    expected_regulation_keys: [UN-R94, US-49CFR571]
    expected_section_paths: []
    key_facts: []
    notes: "Expected: UN R94 (1958 Agreement type approval) for the EU, 49 CFR 571 / FMVSS 208 (self-certification) for the US; no invented requirement."
    source: synthetic
    review_status: DRAFT
  - case_id: sc-031
    query: For a Euro NCAP 2026 frontal rating, which dummies are in the driver and front passenger seats of the offset test?
    query_type: market_context
    difficulty: hard
    expected_regulation_key: EURONCAP-FRONTAL
    expected_section_prefixes: ["scoring"]
    key_facts: ["THOR 50th", "HIII 5th"]
    source: synthetic
    review_status: DRAFT
  - case_id: sc-032
    query: Is the Euro NCAP frontal protocol a legal requirement for type approval in Europe?
    query_type: market_context
    difficulty: hard
    expected_regulation_key: EURONCAP-FRONTAL
    expected_section_paths: []
    key_facts: []
    notes: "Expected: no — a consumer-rating protocol (Euro NCAP copyright/disclaimer); type approval is UN R94/R137. No fabricated legal status."
    source: synthetic
    review_status: DRAFT
  # ---------------------------------------------------------------- calculations
  - case_id: sc-040
    query: Convert the UN R94 offset barrier impact speed into metres per second.
    query_type: calculation
    difficulty: medium
    expected_regulation_key: UN-R94
    expected_section_paths: ["annex-3/4"]
    key_facts: ["56"]
    notes: "Derived value 15.6 m/s (56 / 3.6) must be shown as a calculation, not as a requirement."
    source: synthetic
    review_status: DRAFT
  - case_id: sc-041
    query: Our measured thorax compression is 38 mm. What margin do we have to the UN R94 limit, in mm and percent?
    query_type: calculation
    difficulty: medium
    expected_regulation_key: UN-R94
    expected_section_paths: ["5.2.1.4"]
    key_facts: ["42 mm"]
    notes: "Derived: 4 mm, about 9.5 % — shown as a calculation."
    source: synthetic
    review_status: DRAFT
  - case_id: sc-042
    query: What is the kinetic energy of a 1,500 kg vehicle at the UN R137 full-width test speed?
    query_type: calculation
    difficulty: hard
    expected_regulation_key: UN-R137
    expected_section_paths: ["annex-3/4"]
    key_facts: ["50"]
    notes: "Derived: 50 km/h = 13.9 m/s; E = ½ · 1,500 · 13.9² ≈ 145 kJ — the mass comes from the question, the speed from the evidence."
    source: synthetic
    review_status: DRAFT
  - case_id: sc-043
    query: The R127 headform impact velocity in km/h?
    query_type: calculation
    difficulty: medium
    expected_regulation_key: UN-R127
    expected_section_paths: ["annex-5/5.6"]
    key_facts: ["9.7 m/s"]
    notes: "Derived: 34.9 km/h."
    source: synthetic
    review_status: DRAFT
