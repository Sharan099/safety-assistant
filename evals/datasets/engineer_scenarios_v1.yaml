# Engineer-scenario benchmark: the kinds of questions a passive-safety engineer actually types —
# scenario application ("my M1 car, 1,850 kg…"), short forms and acronyms, cross-document comparison,
# market context (UN type approval vs FMVSS vs Euro NCAP), calculations from stated values, simulation
# set-up from the CAE manuals, follow-up phrasing, and questions the assistant must decline smartly.
#
# Provenance: source=synthetic — written 2026-09-14 from the ingested sections (every key fact is a
# verbatim span of the cited clause, read from the `sections` table); not human-reviewed until the
# owner marks it. Calculations list the input fact only; the derived value is checked by hand in the
# judged report (CALCULATION claims are flagged as derived by the validator).
dataset_version: engineer_scenarios_v1
cases:
  # ---------------------------------------------------------------- scenario application
  - case_id: sc-001
    query: My project is an M1 passenger car with a total permissible mass of 1,850 kg for the EU. Does UN R94 apply to it?
    query_type: scenario_application
    difficulty: medium
    expected_regulation_key: UN-R94
    expected_section_paths: ["1"]
    key_facts: ["3,500 kg"]
    source: synthetic
    review_status: DRAFT
  - case_id: sc-002
    query: We have an N1 van at 2,700 kg total permissible mass. Is it inside the scope of the frontal collision regulation UN R94?
    query_type: scenario_application
    difficulty: hard
    expected_regulation_key: UN-R94
    expected_section_paths: ["1"]
    key_facts: ["2,500 kg"]
    notes: "R94 §1: N1 only up to 2,500 kg — the answer must say the van is outside the scope, not invent an exemption."
    source: synthetic
    review_status: DRAFT
  - case_id: sc-003
    query: Our frontal test result shows a thorax compression of 44 mm on the driver dummy. Does that pass UN R94?
    query_type: scenario_application
    difficulty: medium
    expected_regulation_key: UN-R94
    expected_section_paths: ["5.2.1.4"]
    key_facts: ["42 mm"]
    notes: "Application: 44 mm exceeds the 42 mm limit — fails."
    source: synthetic
    review_status: DRAFT
  - case_id: sc-004
    query: In our full-width test we measured a residual steering wheel displacement of 85 mm upwards. Is that acceptable under UN R137?
    query_type: scenario_application
    difficulty: medium
    expected_regulation_key: UN-R137
    expected_section_paths: ["5.2.2.1"]
    key_facts: ["80 mm"]
    source: synthetic
    review_status: DRAFT
  - case_id: sc-005
    query: After our side impact test the door on the struck side stayed locked but the non-struck side door was still locked too. Is that compliant with UN R95?
    query_type: scenario_application
    difficulty: hard
    expected_regulation_key: UN-R95
    expected_section_paths: ["5.3.2"]
    key_facts: ["non-struck side shall be unlocked"]
    source: synthetic
    review_status: DRAFT
  - case_id: sc-006
    query: Our pedestrian test with the child headform recorded HIC 1,150 at one point of the bonnet. Is UN R127 failed?
    query_type: scenario_application
    difficulty: hard
    expected_regulation_key: UN-R127
    expected_section_paths: ["5.2.1", "5.2.2"]
    key_facts: ["HIC recorded shall not exceed 1,000"]
    notes: "R127 allows a zone split (1,000 over part of the area); the answer must state the 1,000 limit and the area rule rather than a flat fail."
    source: synthetic
    review_status: DRAFT
  # ---------------------------------------------------------------- short forms / acronyms
  - case_id: sc-010
    query: ThCC limit frontal?
