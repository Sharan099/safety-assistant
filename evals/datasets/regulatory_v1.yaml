# Gold evaluation set — regulatory_v1
#
# Growth status: 47 cases (target 200–500, CLAUDE.md §12). Every case was
# authored against the ingested text (section paths verified in the corpus on
# 2026-09-11) and is human-reviewed unless review_status says otherwise.
#
# relevance: a retrieved chunk is relevant when its section path, or any path
# in its merged_paths metadata, is in `expected_section_paths`, or starts with
# an `expected_section_prefixes` entry. Regulation-level hit = regulation_key
# match. Paths are stable across re-chunking; chunk UUIDs are not stored.
#
# answerability: answerable | partial | unanswerable_out_of_scope |
#                unanswerable_not_in_corpus | ambiguous
