# Full local stack: API + PostgreSQL/pgvector + MinIO (S3-compatible artifact store).
#   docker compose -f infra/docker/compose.yaml up --build
name: safety-assistant

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safety}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-safety_assistant}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safety} -d ${POSTGRES_DB:-safety_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 1g } } }

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: [minio:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 10

  migrate:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile }
    command: ["migrate"]
    environment: &appenv
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-safety}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-safety_assistant}
      ARTIFACT_STORE_URI: s3://${ARTIFACT_BUCKET:-safety-artifacts}
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      AUTH_MODE: ${AUTH_MODE:-api_key}
      API_KEYS: ${API_KEYS:-{}}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile }
    environment: *appenv
    ports: ["8010:8010"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy: { resources: { limits: { memory: 2g, cpus: "2" } } }

  worker:
    build: { context: ../.., dockerfile: infra/docker/Dockerfile }
    command: ["worker"]
    environment: *appenv
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy: { resources: { limits: { memory: 3g, cpus: "2" } } }

volumes:
  pgdata:
  minio:
