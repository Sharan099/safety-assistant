# LS-DYNA keyword registry — TRD_LEVEL3.md §8, PRD_LEVEL3.md §11,
# CLAUDE_CODE_LEVEL3_INSTRUCTIONS.md §8.
#
# `structured: true` roots get real per-keyword field extraction
# (packages/cae/lsdyna/parser.py) and map to a dedicated `cae_*` table
# (packages/domain/cae.py) — because TRD_LEVEL3.md §19's required schema
# only lists cae_parts/cae_materials/cae_sections/cae_contacts/cae_controls/
# cae_databases/cae_includes as dedicated entity tables.
#
# `structured: false` roots (including NODE and ELEMENT*, explicitly named
# "minimum" keywords in the PRD/TRD) are still detected, counted, and
# raw-preserved (never silently dropped) — captured generically in
# `cae_keywords`, not decomposed into specific fields. Bulk nodal/element
# geometry belongs in Parquet if ever needed for analysis, not as relational
# rows; TRD_LEVEL3.md §19 deliberately has no cae_nodes/cae_elements table.
#
# A keyword not in this file at all still gets a `RawCard` and a generic
# `cae_keywords` row — this registry controls *how deep* parsing goes, never
# *whether* something is preserved.

schema_version: 1

roots:
  NODE:
    structured: false
  ELEMENT:
    structured: false
  PART:
    structured: true
    table: cae_parts
  SECTION:
    structured: true
    table: cae_sections
  MAT:
    structured: true
    table: cae_materials
  CONTACT:
    structured: true
    table: cae_contacts
  BOUNDARY:
    structured: false
  CONSTRAIN:
    structured: false
  CONTROL:
    structured: true
    table: cae_controls
  DATABASE:
    structured: true
    table: cae_databases
  DEFINE:
    structured: false
  PARAMETER:
    structured: false
  INCLUDE:
    structured: true
    table: cae_includes
