[project]
name = "safety-assistant"
version = "0.2.0"
description = "Automotive passive-safety regulatory knowledge system: versioned ingestion, hybrid retrieval, evidence-verified answers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "numpy>=2.5.2",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-sdk>=1.25",
    "pgvector>=0.5.0",
    "prometheus-client>=0.20",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.9",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.1",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
eval = [
    "deepeval>=3",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=0.3",
    "ragas>=0.2",
]

[project.scripts]
safety-assistant = "safety_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safety_assistant"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Alembic-autogenerated migrations are not hand-styled code.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `Depends(...)` in a parameter default is the framework's documented
# dependency-injection pattern, not the mutable-default-argument bug B008 catches.
"src/safety_assistant/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
# No stub packages: rank-bm25 ships no py.typed; boto3 stubs are optional.
module = ["rank_bm25", "boto3", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [".", "src"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
    "types-pyyaml>=6.0.12.20260724",
]
