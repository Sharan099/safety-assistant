[project]
name = "passive-safety-rag"
version = "0.1.0"
description = "Structure-aware RAG over UNECE passive-safety regulations (Docling + Qdrant)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.0.0",
    "qdrant-client>=1.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sentence-transformers>=3.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "openai>=1.50.0",
    "fastembed>=0.4.0",
    "python-multipart>=0.0.32",
    "pypdf>=6.14.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
vlm = [
    # LightOnOCR-2 for selective figure-adjacent pages (ingestion.vlm_figure_pass).
    # transformers/torch usually already present via docling; listed for clarity.
    "transformers>=4.50.0",
    "Pillow>=10.0.0",
]
eval = [
    "ragas>=0.2.0",
    "deepeval>=2.0.0",
    "deepteam>=0.1.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.0",
    "datasets>=3.0.0",
    "langchain-groq>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langchain-community>=0.3.0",
]
observability = [
    "langfuse>=2.0.0",
]
agent = [
    "langgraph>=0.2.0",
]

[project.scripts]
passive-safety-ingest = "ingestion.run:main"
passive-safety-ask = "app.ask:main"
passive-safety-eval = "eval.run_full:main"
passive-safety-api = "api.main:main"
passive-safety-agent = "agent.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "ingestion",
    "retrieval",
    "generation",
    "api",
    "eval",
    "app",
    "observability",
    "agent",
    "cache",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = ["E501"]
