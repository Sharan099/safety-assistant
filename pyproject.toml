[project]
name = "safety-assistant"
version = "0.2.0"
description = "Automotive passive-safety regulatory knowledge system: versioned ingestion, hybrid retrieval, evidence-verified answers"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "numpy>=2.5.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.9",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safety_assistant"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Alembic-autogenerated migrations are not hand-styled code.
extend-exclude = ["packages/domain/migrations/versions", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `Depends(...)` in a parameter default is the framework's
# documented dependency-injection pattern, not the mutable-default-argument
# bug B008 exists to catch.
"apps/api/**" = ["B008"]
"src/safety_assistant/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
# No stub package exists (types-rank-bm25 isn't published) and the package
# itself ships no py.typed marker.
module = "rank_bm25"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/legacy is the pre-rebuild suite (own database, deleted at cutover):
#   uv run pytest tests/legacy -o addopts=""
addopts = "--ignore=tests/legacy"
asyncio_mode = "auto"
pythonpath = [".", "src"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
    "types-pyyaml>=6.0.12.20260724",
]
# Transitional: the pre-rebuild CAE subsystem (packages/, apps/api) still
# imports these until cutover (docs/rebuild-ledger.md §3.7, decision A).
legacy = [
    "duckdb>=1.5.5",
    "langchain-core>=1.5.4",
    "pandas>=3.0.5",
    "pandas-stubs>=3.0.5.260730",
    "pyarrow>=25.0.1",
    "scipy>=1.18.0",
]
